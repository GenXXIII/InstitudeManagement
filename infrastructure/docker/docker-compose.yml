services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:-Institute!Pass2026}"
    ports:
      - "1433:1433"
    volumes:
      - institute_sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - institute_redis:/data

  api:
    build:
      context: ../..
      dockerfile: backend/src/InstituteManagement.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__UseInMemory: "false"
      ConnectionStrings__Database: "Server=sqlserver,1433;Database=InstituteManagement;User Id=sa;Password=${SQL_PASSWORD:-Institute!Pass2026};TrustServerCertificate=True"
      ConnectionStrings__Redis: redis:6379
      Cors__Origins__0: http://localhost:3000
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ../../frontend/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5080
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  institute_sql:
  institute_redis:
